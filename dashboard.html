    <!DOCTYPE html>
    <html lang="id">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Dashboard Kasir</title>
        <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    </head>
    <body class="bg-gray-50 min-h-screen">
        <nav class="bg-blue-600 p-4 text-white shadow-md flex justify-between items-center">
            <h1 class="text-xl font-bold flex items-center gap-2">📊 Dashboard Kasir Toko Furqon</h1>
            <a href="/" class="bg-blue-500 hover:bg-blue-700 text-sm py-2 px-4 rounded-lg font-medium transition">Kembali ke Home</a>
        </nav>

        <div class="container mx-auto p-6 grid grid-cols-1 md:grid-cols-3 gap-6">
            
            <div class="md:col-span-2 bg-white p-6 rounded-2xl shadow-sm border border-gray-100">
                <h2 class="text-lg font-bold text-gray-800 mb-4 flex items-center gap-2">🛒 Daftar Barang Toko</h2>
                <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
                    
                    <div class="border border-gray-200 p-4 rounded-xl text-center shadow-sm">
                        <span class="text-4xl">☕</span>
                        <h3 class="font-bold text-gray-700 mt-2">Kopi Hangat</h3>
                        <p class="text-sm text-green-600 font-semibold mb-3">Rp 5.000</p>
                        <a href="/tambah?barang=kopi" class="block text-center w-full bg-emerald-500 text-white py-1.5 rounded-lg text-sm font-semibold hover:bg-emerald-600">Tambah</a>
                    </div>

                    <div class="border border-gray-200 p-4 rounded-xl text-center shadow-sm">
                        <span class="text-4xl">🥛</span>
                        <h3 class="font-bold text-gray-700 mt-2">Susu Segar</h3>
                        <p class="text-sm text-green-600 font-semibold mb-3">Rp 7.000</p>
                        <a href="/tambah?barang=susu" class="block text-center w-full bg-emerald-500 text-white py-1.5 rounded-lg text-sm font-semibold hover:bg-emerald-600">Tambah</a>
                    </div>

                    <div class="border border-gray-200 p-4 rounded-xl text-center shadow-sm">
                        <span class="text-4xl">🍞</span>
                        <h3 class="font-bold text-gray-700 mt-2">Roti Bakar</h3>
                        <p class="text-sm text-green-600 font-semibold mb-3">Rp 10.000</p>
                        <a href="/tambah?barang=roti" class="block text-center w-full bg-emerald-500 text-white py-1.5 rounded-lg text-sm font-semibold hover:bg-emerald-600">Tambah</a>
                    </div>

                </div>
            </div>

            <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100 flex flex-col justify-between h-[400px]">
            <div>
                <h2 class="text-lg font-bold text-gray-800 mb-3 border-b pb-2 flex items-center gap-2">🧾 Nota Belanja</h2>
                    {{DAFTAR_BELANJAAN}}
            </div>
                <div class="border-t pt-3">
                    <div class="flex justify-between font-bold text-gray-800 mb-3">
                        <span>Total:</span>
                        <span class="text-green-600">Rp 0</span>
                    </div>
                    <button class="w-full bg-blue-600 text-white py-3 rounded-xl font-bold shadow-md hover:bg-blue-700">
                        CETAK STRUK STRIP 🖨️
                    </button>
                </div>
            </div>

        </div>
    </body>
    </html>
